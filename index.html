<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>背徳のガーデン Portal - My Works</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            /* まぶしさを抑えた、柔らかく薄い黄色のグラデーション背景を維持 */
            background: linear-gradient(135deg, #fef9c3 0%, #fffdf5 50%, #fef9c3 100%);
            color: #ea580c; 
            background-attachment: fixed;
        }
        /* 透過を完全に無くし、文字を見やすくするための白で塗りつぶし設定 */
        .solid-card {
            background-color: #ffffff;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-6 font-sans">

    <!-- コンテンツエリア：不透明な白のボックスに変更して統一感を出しています -->
    <div class="w-full max-w-md mt-8 flex flex-col items-center solid-card p-6 rounded-3xl shadow-2xl">
        
        <!-- 1. プロフィール画像（指定された 顔アイコン.jpg を丸型で配置） -->
        <div class="w-28 h-28 rounded-full border-4 border-orange-100 shadow-md overflow-hidden mb-4 bg-white">
            <img src="顔アイコン.jpg" alt="Profile" class="w-full h-full object-cover">
        </div>

        <!-- 2. プロフィールテキスト（中央寄せで美しく配置） -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-wide text-orange-600 mb-2">
                背徳のガーデン
            </h1>
            <p class="text-[11px] text-amber-950 font-bold leading-relaxed px-6">
                掲載イラストは全てAIで生成しております<br>
                下記リンク先はR-18要素を含みますので、18歳未満の方は閲覧禁止です
            </p>
        </div>

        <!-- 3. リンク一覧部分 -->
        <div class="w-full space-y-4">
          
          <!-- pixiv -->
          <a href="https://www.pixiv.net/users/124124663" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-orange-100">
            <div class="font-extrabold text-lg text-blue-500 mb-1">pixiv</div>
            <div class="text-xs text-amber-900 font-bold leading-tight">
                サブアカウントです。個人的に好きな作品をアップしています。
            </div>
          </a>

          <!-- BOOTH -->
          <a href="https://yakiniku2025.booth.pm/" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-orange-100">
            <div class="font-extrabold text-lg text-pink-500 mb-1">BOOTH</div>
            <div class="text-xs text-amber-900 font-bold leading-tight">
                R-18作品を販売しています。
            </div>
          </a>

          <!-- pictSPACE -->
          <a href="https://pictspace.net/NTRcreate" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-orange-100">
            <div class="font-extrabold text-lg text-green-600 mb-1">pictSPACE</div>
            <div class="text-xs text-amber-900 font-bold leading-tight">
                R-18作品を販売しています。
            </div>
          </a>

        </div>

        <!-- フッター -->
        <p class="text-center text-[10px] text-amber-900/60 mt-16 tracking-wider font-bold">
          © 2026 / Private Portal / No Index Requested
        </p>
    </div>

</body>
</html>
