<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>寝取られクリエイトショップ Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            /* まぶしさを抑えた、少し薄めの青のグラデーション背景 */
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0f2fe 100%);
            color: #0369a1; 
            background-attachment: fixed;
        }
        .solid-card {
            background-color: #ffffff;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-6 font-sans">

    <!-- 不透明な白のコンテンツボックス -->
    <div class="w-full max-w-md mt-8 flex flex-col items-center solid-card p-6 rounded-3xl shadow-2xl">
        
        <!-- 1. プロフィール画像（丸型アイコン） -->
        <div class="w-28 h-28 rounded-full border-4 border-sky-100 shadow-md overflow-hidden mb-4 bg-white">
            <img src="顔アイコン.jpg" alt="Profile" class="w-full h-full object-cover">
        </div>

        <!-- 2. プロフィールテキスト（指定のタイトル名に変更） -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-wide text-sky-700 mb-2">
                寝取られクリエイトショップ
            </h1>
            <p class="text-[11px] text-slate-900 font-bold leading-relaxed px-6">
                掲載イラストは全てAIで生成しております<br>
                下記リンク先はR-18要素を含みますので、18歳未満の方は閲覧禁止です
            </p>
        </div>

        <!-- 3. リンク一覧部分 -->
        <div class="w-full space-y-4">
          
          <!-- pixiv（タイトル色：青） -->
          <a href="https://www.pixiv.net/users/124124663" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-sky-100">
            <div class="font-extrabold text-lg text-blue-600 mb-1">pixiv</div>
            <div class="text-xs text-slate-800 font-bold leading-tight">
                サブアカウントです。個人的に好きな作品をアップしています。
            </div>
          </a>

          <!-- BOOTH（タイトル色：オレンジ） -->
          <a href="https://yakiniku2025.booth.pm/" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-sky-100">
            <div class="font-extrabold text-lg text-orange-500 mb-1">BOOTH</div>
            <div class="text-xs text-slate-800 font-bold leading-tight">
                R-18作品を販売しています。
            </div>
          </a>

          <!-- pictSPACE（タイトル色：そのまま緑） -->
          <a href="https://pictspace.net/NTRcreate" target="_blank"
            class="solid-card block w-full p-5 rounded-2xl shadow-md hover:scale-[1.01] transition-all duration-300 border border-sky-100">
            <div class="font-extrabold text-lg text-green-600 mb-1">pictSPACE</div>
            <div class="text-xs text-slate-800 font-bold leading-tight">
                R-18作品を販売しています。
            </div>
          </a>

        </div>

        <!-- フッター -->
        <p class="text-center text-[10px] text-sky-800/60 mt-16 tracking-wider font-bold">
          © 2026 / Private Portal / No Index Requested
        </p>
    </div>

</body>
</html>
